      name: "Terraform Continuous Integration"

on:
  push:
    branches:
      - main

jobs:
  terraform_pipeline:
    name: "Automated Infrastructure Teardown Pipeline"
    runs-on: ubuntu-latest

    steps:
      - name: "Clone Repository Code Files"
        uses: actions/checkout@v4

      - name: "Install Terraform Engine Binaries"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: "Audit Code Formatting Style Rules"
        run: terraform fmt -check

      - name: "Initialize Remote IaC Workspace"
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: "Compile Pre-Flight Syntax Check"
        run: terraform validate

      # 🧽 THE AUTOMATED TEARDOWN ENGAGED: Connects to your S3 backend and systematically wipes out live assets
      - name: "Execute Automated Live Cloud Infrastructure Teardown"
        run: terraform destroy -auto-approve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

