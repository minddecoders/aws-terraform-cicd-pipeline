      - name: "Initialize Remote IaC Workspace"
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: "Compile Pre-Flight Syntax Check"
        run: terraform validate

      # 🧽 AUTOMATED TEARDOWN SWITCH: Safely targets, hooks into S3 state maps, and deletes all assets
      - name: "Execute Automated Live Cloud Infrastructure Teardown"
        run: terraform destroy -auto-approve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
