name: "Automated GitOps Infrastructure Continuous Delivery" # 🛰️ THE AUTOMATED TRIGGER SECTOR: Fires immediately on any code push to main!
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform_apply:
    name: "Execute Automated Live Cloud Deployment"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository Code"
        uses: actions/checkout@v4

      - name: "Setup Terraform Engine"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2" # Matches your precise local cockpit!

      - name: "Terraform Format Check"
        run: terraform fmt -check -recursive

      - name: "Initialize S3 Remote Backend"
        run: terraform init -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: "Terraform Validate"
        run: terraform validate

      - name: "Generate Live Cloud Infrastructure Plan"
        run: terraform plan -out=tfplan -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: "Execute Saved Plan Forecast"
        run: terraform apply -input=false tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
