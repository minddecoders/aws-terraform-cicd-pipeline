name: "GitOps - Security Plan"

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan:
    name: "Security Audit & IaC Plan Forecast"
    runs-on: ubuntu-latest
    
    defaults:
      run:
        shell: bash
        working-directory: ./application-infra

    steps:
      - name: "Checkout Codebase Repository"
        uses: actions/checkout@v4

      - name: "Run Checkov Static Code Analysis Security Audit"
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          output_format: cli
          soft_fail: true

      # 🔑 STABLE KEYLESS HANDSHAKE: Uses verified v4 to trade OIDC tokens cleanly!
      - name: "Authenticate to AWS using OIDC"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::951614974272:role/sidra-github-actions-oidc-execution-role
          aws-region: eu-west-1

      - name: "Verify AWS OIDC Identity"
        run: aws sts get-caller-identity

      - name: "Setup Terraform Engine"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: "Terraform Format Check"
        run: terraform fmt -check -recursive

      - name: "Initialize S3 Remote Backend"
        run: terraform init -input=false

      - name: "Terraform Validate"
        run: terraform validate

      - name: "Generate Automated Plan Forecast"
        run: terraform plan -input=false
