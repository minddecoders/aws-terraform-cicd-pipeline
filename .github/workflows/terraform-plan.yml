name: "GitOps - Security Plan"

on:
  workflow_dispatch:

jobs:
  terraform-plan:
    name: "Security Audit & IaC Plan Forecast"
    runs-on: ubuntu-latest
    
    # 🛡️ SYSTEM CLEARANCE GATE: Locks security tokens explicitly down to this job block runtime environment!
    permissions:
      contents: read      # Grants permission to read code files safely
      id-token: write     # 🔑 MANDATORY: Authorizes GitHub Actions runner VM to dynamically mint genuine OIDC identity tokens!

    defaults:
      run:
        shell: bash
        working-directory: ./application-infra

    steps:
      - name: "Checkout Codebase Repository"
        uses: actions/checkout@v4

      - name: "Run Checkov Static Code Analysis Security Audit"
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          output_format: cli
          soft_fail: true

      # 🔍 YOUR MASTERPIECE TELEMETRY INJECTION: Unpacks and prints raw structural token payloads live!
      - name: "Debug GitHub OIDC Claims"
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const token = await core.getIDToken('sts.amazonaws.com');
              const payload = JSON.parse(
                Buffer.from(token.split('.')[1], 'base64url').toString()
              );
              console.log("================ GITHUB OIDC JWT CLAIMS ================");
              console.log("SUB:", payload.sub);
              console.log("AUD:", payload.aud);
              console.log("ISS:", payload.iss);
              console.log("REPOSITORY:", payload.repository);
              console.log("REPOSITORY_ID:", payload.repository_id);
              console.log("OWNER_ID:", payload.repository_owner_id);
              console.log("REF:", payload.ref);
              console.log("========================================================");
            } catch (error) {
              console.log("OIDC Token generation failed inside GitHub:", error);
            }

      # 🔑 100% SECURE HANDSHAKE: Uses verified stable v4 to pass genuine OIDC tokens cleanly!
      - name: "Authenticate to AWS using OIDC"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::951614974272:role/sidra-github-actions-oidc-execution-role
          aws-region: eu-west-1
          audience: sts.amazonaws.com

      - name: "Verify AWS OIDC Identity"
        run: aws sts get-caller-identity

      - name: "Setup Terraform Engine"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2" # Aligned to a stable long-term support release

      - name: "Terraform Format Check"
        run: terraform fmt -check -recursive

      - name: "Initialize S3 Remote Backend"
        run: terraform init -input=false

        # 📁 THE WORKSPACE SELECTOR SECTOR: Selects or builds the target environment channel automatically!
      - name: "Select or Create Dev Workspace"
        run: |
          terraform workspace select dev || terraform workspace new dev

      - name: "Terraform Validate"
        run: terraform validate

      - name: "Generate Automated Plan Forecast"
        run: terraform plan -input=false
