name: "Terraform Plan"

on:
  workflow_dispatch: # 🎛️ Manual control switch triggered exclusively by your click!

permissions:
  contents: read

jobs:
  terraform_plan:
    name: "Execute Safe Cloud Infrastructure Forecast"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository Code"
        uses: actions/checkout@v4

      - name: "Setup Terraform Engine"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: "Terraform Format Check"
        run: terraform fmt -check -recursive

      - name: "Initialize S3 Remote Backend"
        run: terraform init -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: "Terraform Validate"
        run: terraform validate

      # 📊 SAFE TRACK: Runs a live forecast comparison check against AWS without modifying a single resource!
      - name: "Generate Live Cloud Infrastructure Plan"
        run: terraform plan -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
