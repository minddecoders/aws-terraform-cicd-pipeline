name: "GitOps - Cloud Destroy"

on:
  workflow_dispatch:
     # 🎛️ CLEANUP TARGETING INPUT SECTOR
    inputs:
      environment:
        description: "Select Target Infrastructure Environment Workspace Tier to Destroye"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  terraform_destroy:
    name: "Execute Automated Live Cloud Teardown"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./application-infra

    steps:
      - name: "Checkout Repository Code"
        uses: actions/checkout@v4

      # ✅ FIX: Downgraded to v4 since v6 is an invalid release tag
      - name: "Authenticate to AWS using OIDC"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::951614974272:role/sidra-github-actions-oidc-execution-role
          aws-region: eu-west-1

      - name: "Verify AWS OIDC Identity"
        run: aws sts get-caller-identity

      - name: "Setup Terraform Engine"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: "Initialize S3 Remote Backend"
        run: terraform init -input=false

        
       # 📁 DYNAMIC FINOPS SELECTION GATEWAY: Targets only the exact sandbox room you mandate!
      - name: "Select Target Workspace Environment"
        run: |
          echo "Targeting teardown operations at environment tier: ${{ github.event.inputs.environment }}"
          terraform workspace select ${{ github.event.inputs.environment }}


      - name: "Terraform Validate"
        run: terraform validate

      - name: "Generate Destruction Forecast Plan"
        run: terraform plan -destroy -out=destroy.tfplan -input=false

      - name: "Execute Saved Destruction Plan"
        run: terraform apply -input=false destroy.tfplan

